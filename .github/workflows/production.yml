name: ComfyLabo production articles

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: Build only, or publish the separately approved production article
        options: [build, build-collection, publish-production]
        default: build

permissions:
  contents: read

concurrency:
  group: comfylabo-production-4484
  cancel-in-progress: false

jobs:
  production:
    if: github.repository == 'ComfyLabo/comfylabo-next' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: '0lwnb6yi'
      NEXT_PUBLIC_SANITY_DATASET: production
      # Empty/default values NEVER enable production publication.
      COMFYLABO_PRODUCTION_AUTO_DEPLOY: ${{ vars.COMFYLABO_PRODUCTION_AUTO_DEPLOY || 'disabled' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:mvp
      - run: npm run test:pull
      - name: Build the approved production scope
        id: build
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action || '' }}
        run: |
          SCOPE="$COMFYLABO_PRODUCTION_AUTO_DEPLOY"
          if [ "$REQUESTED_ACTION" = build-collection ]; then SCOPE=new-articles; fi
          case "$SCOPE" in
            disabled|obsidian-4484)
              npm run article:production:build
              echo 'collection=false' >> "$GITHUB_OUTPUT"
              ;;
            new-articles)
              npm run articles:production:build
              echo 'collection=true' >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'Invalid production scope' >&2; exit 1 ;;
          esac
      - name: Package public content only
        env:
          RELEASE: ${{ steps.build.outputs.release }}
          COLLECTION: ${{ steps.build.outputs.collection }}
        shell: bash
        run: |
          if [ "$COLLECTION" = true ]; then
            python3 -B scripts/production_bundle.py "$RELEASE" .mvp/production-bundle --collection
          else
            python3 -B scripts/production_bundle.py "$RELEASE" .mvp/production-bundle
          fi
      - name: Publish production bundle without SSH or Sanity write credentials
        if: >-
          (env.COMFYLABO_PRODUCTION_AUTO_DEPLOY == 'obsidian-4484' || env.COMFYLABO_PRODUCTION_AUTO_DEPLOY == 'new-articles') &&
          (github.event_name == 'repository_dispatch' || inputs.action == 'publish-production')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COMFYLABO_PRODUCTION_AUTO_DEPLOY" = new-articles ]; then
            TAG=comfylabo-production-collection
          else
            TAG=comfylabo-production-4484
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$COMMIT" --prerelease --latest=false \
              --title 'ComfyLabo production articles' --notes 'Approved published articles only; no server settings or drafts.'
          fi
          gh release upload "$TAG" ".mvp/production-bundle/$TAG.zip" --clobber
          gh release upload "$TAG" ".mvp/production-bundle/$TAG.sha256" --clobber
      - name: Explain a failed production workflow
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## Obsidian記事の本番用生成が完了していません

          原稿・画像・テスト・Release更新の失敗工程を確認してください。
          このActionsはXserverへ接続せず、受信結果も保証しません。
          記事を削除したりPublishを繰り返す前に、受信ログと現在の正常版を確認します。
          手順：docs/production-autopublish.md
          MARKDOWN
